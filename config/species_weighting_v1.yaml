# =====================================================================
# Matriz objetivo por especie — PredictaMAR Litoral
# =====================================================================
#
# Este archivo NO contiene una probabilidad de captura ni un modelo validado.
# Contiene una hipótesis cuantitativa auditable para organizar el backtesting.
# La literatura respalda la selección de algunos predictores, pero NO prueba
# estos pesos numéricos. Los pesos son un prior de ingeniería explícito.
# =====================================================================

schema_version: species_weighting_v1
model_id: predictamar_litoral_species_prior_v1
updated_at: "2026-09-07"
status: research_only_not_predictively_validated

index_contract:
  output_name: experimental_habitat_compatibility_index
  label_es: "Índice experimental de compatibilidad ambiental"
  probability: false
  catch_prediction: false
  operational_ranking_enabled: false
  traffic_light_thresholds: null
  value_range: [0.0, 1.0]
  formula: "I_s = sum_f(weight_bp[s,f] / 10000 * factor_score[s,f])"
  weights:
    unit: basis_points
    required_total_bp: 10000
    runtime_normalization: forbidden
    derivation: provisional_expert_prior
    scientific_limitation: >
      Las fuentes sustentan inclusión, exclusión o necesidad de predictores;
      no estiman estos pesos. Los valores deben recalibrarse con capturas o
      CPUE independientes y validación espacio-temporal fuera de muestra.
  factor_scores:
    required_range: [0.0, 1.0]
    raw_to_score_transform_status: pending_species_calibration
    note: >
      Los rangos observados en literatura no se convierten automáticamente en
      curvas de favorabilidad. Un factor_score solo será admisible cuando su
      transformación cruda-a-score tenga versión, fuente y calibración.
  missing_data:
    imputation: forbidden
    default_zero: forbidden
    weight_redistribution: forbidden
    point_estimate_when_incomplete: forbidden
    diagnostic_bounds: >
      Con faltantes se informa coverage_weight, lower_bound suponiendo cero
      para el aporte desconocido y upper_bound suponiendo uno. Esos límites no
      son un índice y no pueden usarse para ordenar puntos.
  duplicate_signal_controls:
    - inputs: [sst, sst_observed_ostia]
      factor: surface_temperature
      rule: "Una sola señal térmica; OSTIA puede actuar como contraste de calidad, nunca como segundo peso."
    - inputs: [temperature_10m, delta_sst_t10]
      factor: vertical_thermal_0_10m
      rule: "Un solo factor emparejado; delta_sst_t10 no es una termoclina ni un gradiente por metro."
    - inputs: [sst_observed_ostia, thermal_front]
      rule: "Se admite SST y su derivada como factores distintos solo tras medir colinealidad en el backtest."
  safety:
    oleaje:
      weight_bp: 0
      role: safety_gate_only
      rule: "Nunca participa del índice pesquero ni autoriza navegación."

factor_registry:
  surface_temperature:
    label_es: "Condición térmica superficial"
    current_assembler_variables: [sst, sst_observed_ostia]
    availability: implemented_but_transform_unvalidated
    formula_contract: "Una transformación por especie sobre una señal térmica reconciliada; sin sumar dos SST."
  chlorophyll_a:
    label_es: "Clorofila-a superficial"
    current_assembler_variables: [clorofila]
    availability: implemented_but_transform_unvalidated
    formula_contract: "Transformación absoluta y estable entre consultas; se prohíben percentiles calculados sobre el radio pedido."
  thermal_front:
    label_es: "Gradiente térmico regional"
    current_assembler_variables: [thermal_front]
    availability: implemented_but_transform_unvalidated
    formula_contract: "Transformación de magnitud del gradiente OSTIA; no representa por sí sola el área exacta de faena."
  surface_salinity:
    label_es: "Salinidad superficial"
    current_assembler_variables: [salinidad]
    availability: implemented_but_transform_unvalidated
    formula_contract: "Curva por especie pendiente de calibración; no se reutilizan automáticamente los rangos históricos."
  surface_transport:
    label_es: "Transporte superficial"
    current_assembler_variables: [surface_currents]
    availability: implemented_but_derived_features_missing
    formula_contract: "Debe usar vector, persistencia o convergencia; la rapidez sola no es un sustituto validado."
  vertical_thermal_0_10m:
    label_es: "Estructura térmica 0-10 m"
    current_assembler_variables: [temperature_10m, delta_sst_t10]
    availability: implemented_but_transform_unvalidated
    formula_contract: "Factor conjunto del par emparejado; no se duplica la contribución de sus dos salidas."
  bathymetry:
    label_es: "Profundidad y relieve"
    current_assembler_variables: [batimetria]
    availability: implemented_but_transform_unvalidated
    formula_contract: "Curva por especie sobre depth_m/slope_deg; TID no se interpreta como tipo de sustrato."
  surface_dissolved_oxygen:
    label_es: "Oxígeno disuelto superficial"
    current_assembler_variables: []
    availability: missing
    formula_contract: pending
  midwater_dissolved_oxygen:
    label_es: "Oxígeno disuelto subsuperficial"
    current_assembler_variables: []
    availability: missing
    formula_contract: pending
  bottom_temperature:
    label_es: "Temperatura de fondo"
    current_assembler_variables: []
    availability: missing
    formula_contract: pending
  bottom_dissolved_oxygen:
    label_es: "Oxígeno disuelto de fondo"
    current_assembler_variables: []
    availability: missing
    formula_contract: pending
  bottom_salinity:
    label_es: "Salinidad de fondo"
    current_assembler_variables: []
    availability: missing
    formula_contract: pending
  seabed_substrate:
    label_es: "Tipo de sustrato del fondo"
    current_assembler_variables: []
    availability: missing
    formula_contract: pending
  sea_level_anomaly:
    label_es: "Anomalía/altura del nivel del mar"
    current_assembler_variables: []
    availability: missing
    formula_contract: pending
  net_primary_productivity:
    label_es: "Productividad primaria neta"
    current_assembler_variables: []
    availability: missing
    formula_contract: pending
  temperature_50m:
    label_es: "Temperatura a 50 m"
    current_assembler_variables: []
    availability: missing
    formula_contract: pending
  subsurface_transport:
    label_es: "Transporte/corriente subsuperficial"
    current_assembler_variables: []
    availability: missing
    formula_contract: pending
  prey_field:
    label_es: "Disponibilidad o distribución de presas"
    current_assembler_variables: []
    availability: missing
    formula_contract: pending

