# =====================================================================
# Especificación de variables — PredictaMAR Litoral (Pucusana)
# =====================================================================
#
# PRINCIPIO DE DISEÑO (de la auditoría a Costero v1.2, ago 2026):
# este archivo separa TRES dimensiones que antes se confundían en un
# único campo `role`:
#
#   1. intended_role         -> función científica POTENCIAL de la variable
#   2. implementation_status -> si el módulo existe y en qué estado está
#   3. scoring_status        -> si participa o no en el motor de puntaje
#
# Una variable puede tener intended_role: A (capaz de diferenciar puntos)
# y aun así estar sin implementar y fuera del scoring. Confundir esas
# dimensiones fue exactamente el error de Costero v1.2, donde variables
# documentadas como decisorias en realidad no diferenciaban nada.
#
# predictively_valid es una CUARTA dimensión, independiente de las tres
# anteriores: mide si existe evidencia de campo de que la variable mejora
# la predicción. Hoy NINGUNA variable tiene esa evidencia.
# =====================================================================

schema_version: 2

meta:
  proyecto: "PredictaMAR Litoral"
  area_operativa: "Pucusana (ver config/area.yaml)"
  ultima_actualizacion: "2026-08-27"
  nota: >
    Ninguna variable de este archivo tiene predictively_valid: true.
    No existe todavía validación predictiva independiente contra datos de
    campo. Cualquier afirmación de que una variable "funciona" debe
    especificar cuál de las cuatro dimensiones se está afirmando.

# ---------------------------------------------------------------------
# DEFINICIONES DE LOS CAMPOS DE ESTADO
# ---------------------------------------------------------------------
definitions:

  intended_role:
    A: "Función potencial de diferenciar espacialmente entre puntos dentro del área operativa"
    B: "Función potencial de describir la condición general del día, sin diferenciar puntos"
    safety_gate: "Compuerta de seguridad; no participa del ranking pesquero en ningún caso"
    structural_support: "Contexto estructural estático; no es señal dinámica"
    empirical_prior: "Conocimiento empírico previo; requiere control de circularidad"
    por_determinar: "Función potencial aún no establecida; pendiente de diagnóstico"
    rejected: "Evaluada y descartada; ver motivo en el campo `rechazo`"

  implementation_status:
    implementada_validada_tecnicamente: "Módulo existe, y ha pasado suite sintética Y diagnóstico real"
    implementada_validada_sinteticamente: "Módulo existe y pasó su suite sintética; diagnóstico real todavía pendiente"
    implementada_sin_reauditar: "Módulo existe, pero no ha pasado el protocolo actual completo"
    pendiente_siguiente: "Próximo módulo a implementar"
    no_implementada: "No existe módulo en este repositorio"
    bloqueada: "No se implementará mientras persista el motivo de bloqueo"

  scoring_status:
    inactiva: "No participa del motor de puntaje"
    fuera_del_ranking: "Excluida por diseño del ranking pesquero (p.ej. seguridad)"
    no_admitida: "Rechazada; no puede admitirse sin cambiar el motivo de rechazo"

  predictively_valid:
    "null": "Sin evidencia de campo; no se ha evaluado o no se ha demostrado. Se escribe como predictively_valid: null"
    "N/A": "La pregunta no aplica: no es una variable de predicción de captura"
    nota: >
      No se admite el valor true en este esquema mientras no exista una
      validación independiente contra datos de campo documentada.

# ---------------------------------------------------------------------
# PROTOCOLO GLOBAL DE ADMISIÓN AL SCORING
# ---------------------------------------------------------------------
# Ninguna variable entra al motor de puntaje sin recorrer estas etapas en
# orden. Que un fetcher corra sin errores NO es criterio de admisión.
scoring_admission_protocol:
  - paso: 1
    etapa: "relevancia_cientifica"
    criterio: "Existe respaldo en literatura o en datos propios para esperar señal"
  - paso: 2
    etapa: "resolucion_espacial_y_temporal_aceptable"
    criterio: "La resolución permite diferenciar dentro del área operativa litoral"
  - paso: 3
    etapa: "disponibilidad_operativa"
    criterio: "El producto responde de forma consistente en el rango de fechas de uso"
  - paso: 4
    etapa: "seleccion_de_celda_valida_y_cobertura"
    criterio: "Selección espacial trazable, descarte de NaN, límites declarados, cobertura reportada según el método propio del producto"
  - paso: 5
    etapa: "procedencia"
    criterio: >
      La procedencia exigible depende del TIPO de dato.
      Lectura cruda: dataset_id, variable, data_scope y scope_warning.
      Resultado derivado: productos y variables de origen, timestamps de
      entrada, método o fórmula, versión del algoritmo, unidades de salida,
      resolución efectiva y scope_warning.
      Dato estructural o empírico: fuente, versión o fecha de levantamiento,
      método y limitación de alcance.
  - paso: 6
    etapa: "pruebas_sinteticas"
    criterio: "Suite sintética propia, sin consultar la API real"
  - paso: 7
    etapa: "diagnostico_real"
    criterio: "Casos reales contra el producto, incluyendo bordes y fallback si aplica"
  - paso: 8
    etapa: "validacion_independiente_de_campo"
    criterio: "Contraste contra datos de campo/IMARPE, con puntos de control fuera de las zonas empíricas"
  - paso: 9
    etapa: "scoring"
    criterio: "Recién entonces la variable puede admitirse al motor de puntaje"

# ---------------------------------------------------------------------
# CONVENCIONES GLOBALES
# ---------------------------------------------------------------------
# SOLO reglas verdaderamente universales, aplicables a cualquier módulo
# del pipeline con independencia del producto, la cadencia o la geometría.
# Las reglas ligadas a un tipo de producto viven en `profiles`.
global_conventions:

  timezone_operacional:
    valor: "America/Lima"
    aplicabilidad: >
      Se aplica cuando el módulo expone al usuario una fecha u hora, o
      interpreta una ventana solicitada. Un producto estático (p.ej.
      batimetría) no tiene componente temporal y esta regla no le aplica.
    nota_operativa: >
      date.today() en entornos de servidor puede devolver la fecha UTC. Para
      representar "hoy local" debe usarse explícitamente America/Lima o la
      fecha seleccionada por el usuario.

  valores_nativos_y_variables_derivadas:
    ingesta_de_datos_crudos: >
      En la INGESTA, PredictaMAR no interpola, no rellena huecos y no fabrica
      valores. Cada muestra entregada corresponde a un valor nativo del
      producto fuente, en un instante y una celda concretos y declarados.
    variables_derivadas: >
      PredictaMAR SÍ puede CALCULAR variables derivadas a partir de datos
      nativos: diferencias, anomalías, gradientes, convergencia u otras
      transformaciones científicamente definidas. Estas operaciones NO son
      fabricación de valores. Toda variable derivada debe declarar: sus
      entradas, la fórmula o el método aplicado, las unidades de salida, la
      resolución efectiva resultante, el tratamiento de bordes y la versión
      del algoritmo.
    regla_de_presentacion: >
      Una variable derivada NUNCA debe presentarse como una observación
      nativa. La distinción entre lectura cruda y resultado calculado debe ser
      explícita en la salida y en la documentación.
    aclaracion_sobre_los_productos_fuente: >
      Nada de lo anterior afirma que los datos de origen estén libres de
      interpolación. Los productos fuente pueden ser modelos numéricos,
      análisis o productos L4 gap-free, en los que el proveedor ya ha
      realizado asimilación, interpolación o relleno de huecos como parte de
      su procesamiento.

  procedencia:
    regla_general: >
      Toda salida declara su procedencia, incluidos los estados sin dato. La
      limitación de alcance acompaña al dato, no vive solo en la
      documentación. Los campos exigibles dependen del TIPO de dato.
    lectura_cruda:
      campos: ["dataset_id", "variable", "data_scope", "scope_warning"]
    resultado_derivado:
      campos:
        - "productos y variables de origen"
        - "timestamps de entrada"
        - "método o fórmula"
        - "versión del algoritmo"
        - "unidades de salida"
        - "resolución efectiva"
        - "scope_warning"
      nota: >
        Una variable derivada puede depender de uno o varios productos, por lo
        que un único dataset_id no basta para describir su procedencia.
    dato_estructural_o_empirico:
      campos:
        - "fuente"
        - "versión o fecha de levantamiento"
        - "método"
        - "limitación de alcance"

  tratamiento_explicito_de_errores:
    regla: >
      Los errores de USO (p.ej. rango horario inválido) se propagan como
      excepción; no se silencian como ausencia de datos. Los fallos de datos
      o de red producen un estado explícito de "sin datos", nunca un valor
      por defecto disfrazado de lectura real.

  logging:
    regla: >
      Toda excepción que derive en un estado sin dato se registra con traza,
      para que un error de programación no quede indistinguible de una
      ausencia legítima de datos. No se registran credenciales ni información
      sensible.

# ---------------------------------------------------------------------
# PERFILES POR TIPO DE PRODUCTO
# ---------------------------------------------------------------------
# Un perfil agrupa decisiones técnicas que SOLO están justificadas para una
# familia concreta de productos. No son universales: aplicarlas fuera de su
# familia sería exactamente el tipo de generalización indebida que la
# auditoría de Costero identificó como riesgo.
profiles:

  fetcher_puntual_phy_0083deg_pt6h:
    descripcion: >
      Fetcher PUNTUAL de serie temporal sobre la familia física de Copernicus
      a 0.083° con cadencia instantánea de 6 h. Entrega una serie de muestras
      para un punto solicitado, no un campo espacial.
    aplica_a_hoy: ["sst"]
    aplica_a_candidato: ["salinidad"]
    no_aplica_a: >
      Oleaje PT3H (otra cadencia y rol de seguridad), clorofila (producto L4
      gap-free multifuente, resolución ~4 km y semántica temporal diaria; ver
      fetcher_puntual_oceancolour_l4_gapfree_4km_p1d), surface_currents
      (misma familia, resolución y cadencia, pero VECTORIAL: usa
      fetcher_puntual_vectorial_phy_0083deg_pt6h, con emparejamiento
      estricto de componentes y selección de celda por instante), OSTIA,
      batimetría, radar, campos espaciales y variables derivadas como frentes
      o gradientes. Ninguna de estas variables hereda este perfil: cada una
      usa el suyo o deberá definir sus propios límites y su propio método
      espacial.
    reglas:
      ventana_horaria: >
        Se define en fecha y hora LOCAL de Pucusana y se convierte a UTC antes
        de consultar. Nunca cruza la fecha local solicitada, aunque en UTC sí
        cruce de fecha.
      una_sola_celda_por_serie: >
        Toda la serie procede de una única celda: mayor cobertura temporal
        dentro de la ventana y, en empate, menor distancia Haversine. La serie
        nunca salta entre celdas.
      cobertura_temporal_declarada: >
        Se reportan n_native_times_in_window, n_samples, n_missing_samples y
        coverage_fraction. coverage_fraction mide únicamente la proporción de
        instantes nativos DENTRO de la ventana cubiertos por la celda
        seleccionada.
      fallback_temporal_determinista: >
        Si la ventana no contiene ningún valor válido, se acepta el instante
        nativo más cercano fuera de ella dentro del límite; a igual desfase se
        prefiere el instante ANTERIOR. Nunca se interpola: el valor es nativo.
      max_valid_cell_distance_km:
        valor: 6.5
        estado: "PROVISIONAL — pendiente de validación oceanográfica"
        criterio: "Mitad de la diagonal de una celda de la grilla nativa (~9.2 km)"
        alcance: "Justificado SOLO para esta familia de productos"
      max_temporal_offset_hours:
        valor: 3.0
        estado: "PROVISIONAL — pendiente de validación oceanográfica"
        criterio: "Mitad de la cadencia de 6 h de esta familia"
        alcance: "Justificado SOLO para esta familia de productos"

  fetcher_puntual_oceancolour_l4_gapfree_4km_p1d:
    descripcion: >
      Fetcher PUNTUAL sobre el producto Ocean Colour L4 gap-free multifuente
      de ~4 km con cadencia diaria (P1D). Entrega UNA lectura para un punto y
      una fecha local solicitados, no una serie temporal ni un campo espacial.
    aplica_a_hoy: ["clorofila"]
    no_aplica_a: >
      Ningún otro producto hereda estas reglas. Son propias de esta familia
      Ocean Colour L4 gap-free, de su grilla de ~4 km y de su cadencia diaria:
      no se aplican a la familia física PT6H, ni al producto de oleaje PT3H,
      ni a productos observacionales L3, ni a campos espaciales o variables
      derivadas. Cada producto debe declarar sus propios límites y su propio
      método de selección.
    reglas:
      fuente_unica: >
        Se consulta un solo dataset. No hay fuente primaria ni secundaria, no
        hay conmutación entre productos y no hay respaldo alternativo: si este
        producto no ofrece un dato admisible, el resultado es SIN_DATOS.
      conversion_temporal: >
        Los timestamps nativos son de 00:00 UTC y corresponden a las 19:00
        hora local de Pucusana del día ANTERIOR. Todo timestamp se convierte a
        America/Lima ANTES de asociarlo a una fecha local; la fecha UTC nunca
        se usa como fecha local.
      seleccion_del_instante: >
        La referencia es 23:59:59 de la fecha local solicitada. Nunca se usan
        observaciones posteriores a ese final local. Entre los instantes que
        tengan alguna celda válida y admisible se elige el MÁS RECIENTE.
      seleccion_espacial: >
        Del recuadro consultado se descartan las celdas NaN y las que superen
        la distancia máxima aceptable; entre las restantes se toma la MÁS
        CERCANA al punto solicitado, con desempate determinista por menor
        latitud y luego menor longitud. No se toma máximo espacial ni
        promedio.
      sin_relleno_anadido: >
        PredictaMAR no interpola, no promedia y no rellena huecos. El producto
        de origen es L4 gap-free y ya incorpora relleno del proveedor, pero
        sobre esa salida no se añade ninguna capa adicional: cada valor
        entregado es nativo del producto.
      max_temporal_age_hours:
        valor: 72.0
        estado: "PROVISIONAL — pendiente de validación oceanográfica"
        criterio: "Cadencia diaria y latencia observada del producto NRT"
        alcance: "Justificado SOLO para esta familia de productos"
      max_valid_cell_distance_km:
        valor: 6.5
        estado: "PROVISIONAL — pendiente de validación oceanográfica"
        criterio: "Acorde a la grilla de ~4.5 km zonales en la latitud de Pucusana"
        alcance: "Justificado SOLO para esta familia de productos"

  fetcher_campo_ostia_l4_005deg_p1d:
    descripcion: >
      Fetcher de CAMPO ESPACIAL sobre OSTIA L4 diario gap-free a 0.05°.
      Devuelve una grilla para un recuadro técnico explícito, no una lectura
      puntual y no una geometría operativa de pesca.
    aplica_a_hoy: ["sst_observed_ostia"]
    no_aplica_a: >
      No lo heredan la SST de modelo PT6H, clorofila, oleaje ni ningún fetcher
      puntual. thermal_front consume su salida, pero usa un perfil derivado
      propio y nunca se presenta como observación nativa.
    reglas:
      fuente_unica:
        producto: "SST_GLO_SST_L4_NRT_OBSERVATIONS_010_001"
        dataset_id: "METOFFICE-GLO-SST-L4-NRT-OBS-SST-V2"
        variables: ["analysed_sst", "analysis_error"]
      campo_y_fecha_unicos: >
        SST y error deben compartir exactamente timestamp, latitudes y
        longitudes. No se alinean, interpolan ni combinan fechas distintas.
      unidades: >
        analysed_sst se conserva en kelvin y también se expone su conversión
        exacta a grados Celsius. analysis_error permanece en kelvin.
      temporalidad: >
        Producto diario, media de 00:00 a 24:00 UTC centrada a las 12:00 UTC.
        La fecha solicitada es la FECHA NOMINAL UTC de esa media diaria. La
        coordenada temporal cruda del servicio se conserva como procedencia,
        pero nunca se convierte a America/Lima para decidir qué día representa:
        el servicio puede etiquetar el mismo contrato diario a las 00:00 UTC,
        mientras el PUM y los nombres de archivo lo centran a las 12:00 UTC.
        Ambas etiquetas conservan el mismo día UTC. Si falta la fecha nominal,
        se admite provisionalmente una fecha anterior de hasta 2 días; nunca
        una fecha nominal futura.
      faltantes_y_cobertura: >
        Los NaN permanecen como faltantes. Se informan celdas totales, celdas
        válidas y fracción de cobertura; PredictaMAR no añade relleno.
      recuadro: >
        Los límites geográficos son argumentos explícitos. No se derivan del
        alcance 0–10 km ni lo redefinen.

  derivada_gradiente_termico_ostia_v1:
    descripcion: >
      Gradiente espacial calculado por PredictaMAR sobre un único campo OSTIA.
      Es una variable DERIVADA, no una observación nativa.
    aplica_a_hoy: ["thermal_front"]
    reglas:
      fuente: "sst_observed_ostia, mismo campo y timestamp"
      algoritmo: "finite_difference_haversine_v1"
      formula: "sqrt((dT/dx)^2 + (dT/dy)^2)"
      unidades: "degree_Celsius km-1"
      distancias: "Haversine entre centros reales de celdas"
      interior: "diferencias centradas cuando existen ambos vecinos"
      bordes: "diferencias unilaterales declaradas cuando existe un solo vecino"
      faltantes: >
        Si una componente no tiene vecinos válidos, el gradiente de esa celda
        es null. No se rellena, no se transforma en cero y no se usa un vecino
        diagonal como sustituto silencioso.
      interpretacion: >
        Se entrega intensidad cruda sin umbral de frente fuerte, clasificación
        favorable, ranking ni scoring.

  fetcher_puntual_vectorial_phy_0083deg_pt6h:
    descripcion: >
      Fetcher PUNTUAL VECTORIAL sobre la familia física de Copernicus a
      0.083° con cadencia instantánea de 6 h. A diferencia del perfil escalar
      de la misma familia, aquí el dato es un VECTOR de dos componentes
      nativas (este y norte) que deben leerse juntas: una celda solo es
      válida si ambas lo son en el mismo instante, profundidad y coordenada.
    aplica_a_hoy: ["surface_currents"]
    no_aplica_a: >
      No lo heredan las variables escalares. sst y salinidad usan
      fetcher_puntual_phy_0083deg_pt6h aunque compartan familia, resolución y
      cadencia: su regla de celda única para toda la serie y su fallback
      temporal fuera de ventana no aplican aquí. Tampoco lo heredan oleaje,
      clorofila, campos espaciales ni variables derivadas.
    reglas:
      lectura_vectorial_estricta: >
        Las dos componentes se solicitan JUNTAS en la misma consulta. Una
        celda con una componente válida y la otra en NaN se descarta por
        completo: medio vector no es un vector, y tomar la componente ausente
        como cero fabricaría una dirección que nadie midió.
      ejes_comunes: >
        Instantes, latitudes y longitudes se cruzan explícitamente entre las
        dos componentes. Una etiqueta presente en una y ausente en la otra
        descarta SOLO esa celda o ese instante, nunca el día entero ni por la
        vía del manejador general de excepciones.
      ventana_horaria: >
        Se define en fecha y hora LOCAL de Pucusana y se convierte a UTC. Los
        cuatro instantes nativos caen en 01:00, 07:00, 13:00 y 19:00 local;
        el de las 19:00 corresponde a las 00:00 UTC del día siguiente.
      version_y_parte_explicitas: >
        La versión y la parte se pasan explícitamente a la consulta, para que
        lo documentado y lo abierto no puedan divergir.
      profundidad: >
        Se consulta con maximum_depth y SIN minimum_depth, y se toma el nivel
        más somero COMÚN a ambas componentes, elegido dinámicamente. No se
        hardcodea ninguna profundidad.
      seleccion_espacial: >
        Por cada instante se toma la celda MÁS CERCANA con par completo
        dentro del límite de distancia, con desempate determinista por menor
        distancia, luego menor latitud y luego menor longitud. Si la más
        cercana tiene el par incompleto, la siguiente completa ocupa su
        lugar.
      seleccion_por_instante: >
        La celda se elige POR INSTANTE, no una sola para toda la serie. Es
        una diferencia deliberada respecto del perfil escalar y debe tenerse
        en cuenta al derivar features de persistencia: la serie puede cambiar
        de celda entre instantes, y cada medición declara la suya.
      cobertura_esperada_dinamica: >
        Los instantes ESPERADOS se calculan desde la ventana solicitada, no
        son un número fijo: un día completo espera cuatro y una ventana 00-06
        espera uno. Así, los timestamps que el producto no devuelve también
        cuentan como ausentes, no solo los devueltos con el par incompleto.
      cobertura_sin_relleno: >
        Los instantes sin par admisible se reportan como cobertura
        incompleta. No se interpola, no se promedia, no se rellenan
        timestamps y no se fabrica cero.
      derivadas_declaradas: >
        speed = sqrt(uo^2 + vo^2) y direction_toward = degrees(atan2(uo, vo))
        mod 360 son transformaciones algebraicas exactas de dos valores
        nativos de la misma celda e instante, no interpolaciones. La
        dirección es hacia la que FLUYE el agua, en grados desde el norte y
        en sentido horario (convención oceanográfica). En un VECTOR NULO la
        dirección es null, no 0 grados: atan2(0,0) devolvería 0.0, que se
        leería como "hacia el norte", y eso sería fabricar una orientación.
      max_valid_cell_distance_km:
        valor: 6.5
        estado: "PROVISIONAL — pendiente de validación oceanográfica"
        alcance: "Justificado SOLO para esta familia de productos"
      surface_search_max_depth_m:
        valor: 5.0
        estado: "Techo de la banda superficial de búsqueda, no un nivel fijo"
  fetcher_puntual_estatico_gebco_15arcsec:
    descripcion: >
      Fetcher PUNTUAL ESTÁTICO sobre la grilla global GEBCO_2026 de 15 segundos
      de arco, registrada al centro del píxel y servida por OPeNDAP desde el
      CEDA del NERC. El fondo marino no tiene cadencia: este perfil no define
      ventana temporal, ni instantes esperados, ni antigüedad máxima, ni
      fallback de tiempo. Combina DOS recursos de la misma geometría -- la
      elevación y la grilla Type Identifier (TID) -- que deben leerse alineados
      celda a celda.
    aplica_a_hoy: ["batimetria"]
    no_aplica_a: >
      Ningún producto dinámico hereda este perfil. sst, salinidad y
      surface_currents pertenecen a la familia física de Copernicus y tienen
      cadencia; oleaje es una compuerta de seguridad PT3H; clorofila es un L4
      diario. Ninguno comparte con este perfil ni la geometría, ni el proveedor,
      ni la ausencia de tiempo. A la inversa, este perfil NO hereda de ellos el
            límite de 6.5 km, que sería absurdo sobre una grilla unas veinte veces
      más fina por eje (unas cuatrocientas veces menor en área de celda)..
    reglas:
      naturaleza_estatica: >
        La API pública recibe únicamente latitud y longitud. No existe fecha,
        ventana horaria ni conversión a hora local de Pucusana.
      recuadro_minimo: >
        Se solicita solo ±2.5 celdas alrededor del punto (unas 5x5 celdas
        nativas), suficiente para buscar la celda oceánica más cercana y sus
        cuatro vecinos cardinales. La grilla completa (43200 x 86400 celdas)
        NUNCA se materializa.
      cierre_de_conexiones: >
        Ambos recursos OPeNDAP se abren como context managers, se recorta, se
        cargan en memoria únicamente esos dos recortes y se cierran antes de
        devolverlos. No queda ninguna conexión remota abierta por llamada.
      alineacion_verificada_en_ejecucion: >
        Antes de combinar elevación y TID se comprueba que ambos declaren las
        dimensiones (lat, lon) EN ESE ORDEN, la misma forma y las mismas
        coordenadas valor a valor. Un TID transpuesto declara los mismos ejes
        con los mismos valores, de modo que comparar solo las coordenadas lo
        dejaría pasar y asignaría la procedencia a la celda equivocada. Ante
        cualquier desalineación se registra con traza y se devuelve SIN_DATOS.
      celda_oceanica: >
        Una celda es oceánica solo si su elevación es finita y ESTRICTAMENTE
        negativa. El cero NO es mar: en GEBCO corresponde a línea de costa o
        tierra a nivel del mar, y tratarlo como profundidad cero convertiría
        tierra en un fondeadero de 0 m.
      seleccion_espacial: >
        Se elige la celda oceánica válida MÁS CERCANA dentro del vecindario
        nativo inmediato -- distancia de índice 1 respecto de la celda
        geométricamente más próxima -- con desempate determinista por menor
        distancia, luego menor latitud y luego menor longitud. No se interpola,
        no se rellena, no se promedia y no se fabrican valores.
      limite_espacial_derivado: >
        El límite NO es una distancia heredada sino el propio vecindario
        nativo. En la latitud de Pucusana la celda mide ~452.4 m en longitud y
        ~463.3 m en latitud (diagonal ~647.5 m), de modo que la distancia
        máxima posible queda por debajo de 1 km. Cada lectura declara su
        distancia real en metros.
      pendiente_condicionada: >
        La pendiente se calcula SOLO por diferencias centradas con los cuatro
        vecinos cardinales, todos oceánicos y válidos, y con distancias
        métricas reales entre los centros de celda. Si falta uno, el resultado
        es null con motivo explícito: NO se recurre a una diferencia lateral,
        porque desplazaría el punto de cálculo y sesgaría la serie costera
        siempre en la misma dirección, de forma invisible.
      curvatura_no_implementada: >
        Deliberadamente ausente. Falta acordar la definición (laplaciana,
        media, gaussiana, de perfil o de planta) y observar antes el TID real.
        Una segunda derivada sobre una superficie posiblemente interpolada
        amplificaría el artefacto de interpolación. No se devuelve cero: un
        cero se leería como fondo plano.
      procedencia_tid_dinamica: >
        El significado de cada código TID se lee dinámicamente de los atributos
        flag_values y flag_meanings del propio archivo. No se mantiene una
        tabla duplicada en el código, que podría divergir de la fuente y
        convertirse en una verdad paralela. La AGRUPACIÓN por rangos sí es
        política declarada del proyecto.
      errores: >
        Los argumentos inválidos se validan ANTES de tocar la red y propagan
        ValueError. Los fallos de red, OPeNDAP, esquema o datos se registran
        con logger.exception y producen SIN_DATOS, sin credenciales ni
        información sensible.
    dependencias_python:
      - "pydap==3.5.10"
      - "dask[array]==2026.7.1"
  pendiente_de_definir:
    descripcion: >
      Marcador para variables cuyo perfil técnico (método espacial, límites,
      tratamiento temporal) todavía no se ha establecido. No hereda ningún
      límite de otro perfil.

