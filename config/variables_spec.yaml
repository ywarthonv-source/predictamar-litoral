    resolucion_metrica_pucusana:
      dx_m: 452.4
      dy_m: 463.3
      diagonal_m: 647.5
      nota: >
        Calculada en la latitud de Pucusana. La grilla de 15 segundos de arco
        es unas veinte veces más fina por eje que la grilla física de 0.0833°
        (unas cuatrocientas veces menor en área de celda), por lo que puede
        diferenciar múltiples celdas dentro del alcance operativo de 0-10 km.
    seleccion_celda_oceanica: >
      Celda oceánica válida más cercana dentro del vecindario nativo inmediato
      (distancia de índice 1). Oceánica significa elevación finita y
      ESTRICTAMENTE negativa: el cero no es mar y tierra nunca se trata como
      profundidad cero. Desempate determinista por distancia, latitud y
      longitud. Sin interpolación, relleno, promedio ni valores fabricados.
    limite_espacial: >
      No hereda los 6.5 km de los productos PT6H. El límite es el vecindario
      nativo, que acota la distancia máxima por debajo de 1 km; cada lectura
      declara su distancia real en metros.
    derivados:
      depth_m: "positiva, derivada solo cuando elevation_m < 0"
      slope_deg: >
        Diferencias centradas con los CUATRO vecinos cardinales, todos
        oceánicos y válidos, y distancias métricas reales entre centros de
        celda. Si falta un vecino es null con motivo explícito; nunca una
        diferencia lateral silenciosa.
      curvatura: "NO implementada; ver nota del perfil. No se devuelve cero."
    procedencia_tid:
      lectura: "dinámica desde flag_values y flag_meanings del propio archivo"
      agrupacion:
        directa: "10-17"
        indirecta: "40-48"
        mixta_desconocida: "70-72"
        no_clasificado: >
          Cualquier código fuera de los rangos anteriores, incluidos 0 (tierra)
          y 127 (relleno). No se fuerzan a mixta_desconocida: clasificarlos sin
          criterio inventaría una procedencia que la fuente no declara.
      limitacion_observada:
        descripcion: >
          En GEBCO_2026 los atributos NO tienen la misma longitud: 21
          flag_values frente a 19 flag_meanings. No existe correspondencia
          posicional fiable.
        flag_values: 21
        flag_meanings: 19
        tratamiento: >
          No se empareja nada. Rellenar, truncar o adivinar el desfase
          asignaría a un código un significado que el archivo no afirma, y ese
          error sería invisible. tid_meaning queda en null y tid_meaning_source
          declara el motivo. El código numérico y su grupo de procedencia se
          conservan intactos.
        motivo_declarado: "flag_values/flag_meanings_inconsistentes:21_valores_vs_19_significados"
    estados:
      - enum_name: "VALIDA"
        serialized_value: "valida"
        criterio: "existe celda oceánica válida en el vecindario nativo"
      - enum_name: "SIN_DATOS"
        serialized_value: "sin_datos"
        criterio: >
          no hay celda oceánica, o fallaron la alineación, el proveedor o los
          datos; nunca significa profundidad cero
    enum_class: "BathymetryStatus"
    enum_class_procedencia: "TidGroup"
    alcance: >
      Batimetría regional de referencia, ESTÁTICA; NO es medición in situ en
      Pucusana, NO es apta para navegación, seguridad marítima ni autorización
      de faena.
    advertencias:
      - "La resolución de la grilla NO equivale a la resolución real del levantamiento"
      - "El datum vertical puede NO ser homogéneo en aguas someras"
      - "El TID describe procedencia, no garantiza exactitud"
      - "La pendiente es derivada, no una observación, y puede reflejar interpolación"
      - "No participa en el scoring y no implica aptitud pesquera"
    dependencias_python:
      - "pydap==3.5.10"
      - "dask[array]==2026.7.1"
    validacion_ejecutada:
      - "Compilación"
      - "Suite sintética 22/22"
      - "Regresión conjunta 105/105 (10 temperatura + 15 salinidad + 18 oleaje + 18 clorofila + 22 corrientes + 22 batimetría), sin acceso a red"
      - "Compuerta de acceso oficial: endpoints OPeNDAP de CEDA con HTTP 200 en elevación y TID, dimensiones (43200, 86400) en ambos y ejes alineados"
      - "Diagnóstico real en Pucusana: status=valida, depth_m=28.0, tid_code=40, tid_group=indirecta, tid_meaning=null con motivo flag_values/flag_meanings_inconsistentes:21_valores_vs_19_significados, slope_deg=null por vecinos_no_oceanicos_o_invalidos: este"
    diagnostico_real:
      punto: "Caleta Pucusana (-12.471, -76.790)"
      status: "valida"
      depth_m: 28.0
      tid_code: 40
      tid_group: "indirecta"
      tid_meaning: null
      tid_meaning_source: "flag_values/flag_meanings_inconsistentes:21_valores_vs_19_significados"
      slope_deg: null
      slope_unavailable_reason: "vecinos_no_oceanicos_o_invalidos: este"
      lectura: >
        La profundidad es válida y el código TID 40 cae en el grupo de
        procedencia INDIRECTA definido por la política de rangos del proyecto.
        El significado fuente exacto del código no puede determinarse porque
        GEBCO_2026 declara 21 flag_values y solo 19 flag_meanings; por eso no se
        afirma si corresponde específicamente a interpolación, predicción u
        otro método. La pendiente no es calculable porque el vecino ESTE no es
        oceánico o es inválido. Esta limitación se declara en vez de sustituirla
        por una diferencia lateral.
