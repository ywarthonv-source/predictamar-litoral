    dataset_id: "cmems_mod_glo_wav_anfc_0.083deg_PT3H-i"
    variable: "VHM0"
    producto:
      version: "202411"
      parte: "default"
      nota: >
        Versión y parte observadas en la selección del toolbox durante el
        diagnóstico real. No se ejecutó un diagnóstico de catálogo completo
        para este producto, por lo que no se registran aquí product_id,
        estado de retiro ni otros metadatos no observados.
    cadencia: "instantánea cada 3 horas"
    resolucion_km: 8.9
    agregacion:
      temporal: >
        Máximo temporal nativo de VHM0 por celda dentro de la ventana. No se
        promedia: importa el peor momento, no el típico.
      espacial: >
        Entre las celdas que tengan al menos un valor válido en la ventana y
        cuyo centro esté a una distancia menor o igual que
        MAX_VALID_CELL_DISTANCE_KM del punto solicitado, se selecciona la de
        MAYOR máximo temporal de VHM0 -- no la más cercana.
      desempate: >
        A igual máximo, menor distancia Haversine; si el empate persiste,
        menor latitud y luego menor longitud. Determinista: no depende del
        orden en que el producto devuelva las coordenadas.
      prohibiciones:
        - "No se amplía el recuadro consultado"
        - "No se interpola"
        - "No se promedia"
        - "No se fabrica ningún valor"
      justificacion: >
        Es una compuerta de SEGURIDAD. Ante dos celdas ambas admisibles,
        quedarse con la que reporta menos oleaje sería elegir la lectura más
        favorable, que es precisamente el patrón fail-open que este módulo
        existe para evitar. La cercanía sigue acotada por el límite de
        distancia; dentro de ese límite manda la condición más adversa.
    limites_propios:
      wave_height_threshold_m:
        valor: 1.5
        estado: "PROVISIONAL — pendiente de validación oceanográfica"
      max_valid_cell_distance_km:
        valor: 6.5
        estado: "PROVISIONAL — pendiente de validación oceanográfica"
      nota: >
        Estos límites NO derivan del perfil de la familia PT6H: fueron
        fijados para este producto y siguen marcados como provisionales en
        el código. El criterio espacial conservador también es provisional.
    estados:
