    units_direccion: "degrees"
    nota_unidades: >
      Unidades nativas del producto. Se conservan y se transportan tal cual:
      no se convierten a nudos ni a otra escala.
    cadencia: "instantánea cada 6 horas (PT6H)"
    instantes_locales_pucusana: ["01:00", "07:00", "13:00", "19:00"]
    resolucion_km: 9.0578
    nota_resolucion: "Resolución zonal calculada en la latitud de Pucusana desde el paso de longitud declarado (0.083333°)"
    naturaleza_vectorial: >
      uo y vo son las dos componentes de un mismo vector. Una celda solo es
      válida si AMBAS lo son en el mismo instante, profundidad y coordenada.
      Un par incompleto se descarta: no se completa la componente ausente con
      cero ni con ningún otro valor.
    derivadas:
      rapidez: "sqrt(uo^2 + vo^2)"
      direccion: "degrees(atan2(uo, vo)) mod 360"
      vector_nulo: >
        Si uo y vo son exactamente cero, la rapidez es 0.0 y la dirección es
        null, NO 0 grados: un vector de módulo nulo no apunta al norte, no
        tiene dirección.
      convencion_direccion: >
        Dirección HACIA LA QUE FLUYE el agua, en grados desde el norte y en
        sentido horario. La convención meteorológica es la contraria;
        confundirlas invierte el resultado 180 grados.
      nota: >
        Ambas son transformaciones algebraicas exactas de dos valores nativos
        de la misma celda e instante, no interpolaciones ni mediciones
        independientes.
    cobertura:
      expected_instants: >
        Calculado desde la ventana solicitada, no fijo: un día completo
        espera cuatro instantes y una ventana 00-06 espera uno.
      n_missing_measurements: >
        max(0, expected_instants - n_measurements). Cuenta también los
        timestamps que el producto no devuelve, no solo los devueltos con el
        par incompleto. Se aplica igual sin timestamps, sin profundidad común
        y tras una excepción.
      ejes_comunes: >
        Un desajuste de ejes entre uo y vo descarta solo la celda o el
        instante afectado, nunca el día completo.
    profundidad:
