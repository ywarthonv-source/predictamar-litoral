      nota: >
        Límite provisional propio de este producto. Cualquier interpretación
        pesquera de estas lecturas es igualmente provisional: esta
        integración no ejecuta el paso 8 ni demuestra validez predictiva.
    estados:
      - enum_name: "VALIDA_EN_VENTANA"
