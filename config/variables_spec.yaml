    aporte_y_limite: >
      Aporta el eje de TRANSPORTE, que ni SST, ni salinidad, ni clorofila
      transportan. El valor ecológico esperado está en los features DERIVADOS
      (persistencia, convergencia/divergencia, relación con la costa), no en
