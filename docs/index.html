<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PredictaMAR · Pucusana</title>
<meta name="theme-color" content="#06121b">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* =====================================================================
   PredictaMAR — pantalla del pescador

   Se usa entre las 4 y 7 de la manana o las 4 y 7 de la tarde, a oscuras,
   para copiar coordenadas a un GPS. Eso manda sobre todo lo demas:
   oscuro por defecto, la coordenada es lo mas grande, sin fuentes ni
   imagenes externas porque en la caleta no hay senal.
   ===================================================================== */
:root{
  --agua-honda:#06121b; --agua:#0d2333; --agua-clara:#16384d;
  --espuma:#e8f1f5; --bruma:#8fa9b8;
  --fosforo:#3fd9b0; --alarma:#ff9a52;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--agua-honda);color:var(--espuma);
  font-family:"Segoe UI",Roboto,-apple-system,system-ui,sans-serif;
  font-size:17px;line-height:1.5;max-width:36rem;margin-inline:auto;
  padding:0 1.1rem 3rem;
}
h1,h2{line-height:1.22;margin:0}
button{font-family:inherit}
.oculto{display:none !important}

/* acceso */
#acceso{min-height:82vh;display:flex;flex-direction:column;justify-content:center}
.logo{font-size:1.75rem;font-weight:700;margin-bottom:.25rem}
.bajada{color:var(--bruma);font-size:.98rem;margin:0 0 2.2rem}
label{display:block;font-size:.88rem;color:var(--bruma);margin:0 0 .35rem}
input,select{
  width:100%;background:var(--agua);color:var(--espuma);
  border:1px solid var(--agua-clara);border-radius:.45rem;
  padding:.78rem .8rem;font-size:1.02rem;font-family:inherit;margin-bottom:1rem;
}
input:focus,select:focus{outline:2px solid var(--fosforo);outline-offset:1px}
.principal{
  width:100%;background:var(--fosforo);color:var(--agua-honda);border:0;
  border-radius:.45rem;padding:.85rem;font-size:1.05rem;font-weight:700;cursor:pointer;
}
.error{color:var(--alarma);font-size:.92rem;margin:.2rem 0 1rem;min-height:1.2rem}

/* encabezado */
header{padding:1.5rem 0 .4rem;display:flex;justify-content:space-between;align-items:baseline}
.marca{font-size:1.02rem;font-weight:600}
.caleta{color:var(--bruma);font-weight:400}
.salir{background:none;border:0;color:var(--bruma);font-size:.85rem;cursor:pointer;padding:.3rem}
.dato{
  margin:.7rem 0 1rem;padding:.65rem .8rem;background:var(--agua);
  border-radius:.5rem;border-left:3px solid var(--fosforo);font-size:.9rem;color:var(--bruma);
}
.dato strong{color:var(--espuma)}
.dato.viejo{border-left-color:var(--alarma);background:#2a1a0f}
.dato.viejo strong{color:var(--alarma)}

/* panel Hoy */
.hoy{margin:0 0 1.4rem}
.hoy-titulo{font-size:.88rem;color:var(--bruma);margin:0 0 .45rem}
.fichas{display:flex;flex-wrap:wrap;gap:.5rem}
.ficha{
  display:flex;flex-direction:column;align-items:flex-start;gap:.05rem;
  background:var(--agua);border:1px solid var(--agua-clara);border-radius:.55rem;
  padding:.5rem .75rem;cursor:pointer;color:var(--espuma);font-size:.95rem;text-align:left;
}
.ficha .ficha-cal{font-size:.82rem;font-weight:600}
.ficha.activa{border-color:var(--fosforo);outline:1px solid var(--fosforo)}

/* controles */
.panel{background:var(--agua);border:1px solid var(--agua-clara);
       border-radius:.65rem;padding:1rem;margin-bottom:1.6rem}
.panel h2{font-size:1rem;margin-bottom:.9rem}
.par{display:flex;gap:.7rem}
.par>div{flex:1}
.nota{color:var(--bruma);font-size:.82rem;margin:-.6rem 0 1rem}

/* zonas */
.encabeza{margin:1.9rem 0 .3rem;font-size:1.3rem;font-weight:600}
.aclara{margin:0 0 1.3rem;color:var(--bruma);font-size:.94rem}
.zona{background:var(--agua);border:1px solid var(--agua-clara);
      border-radius:.65rem;padding:1rem;margin-bottom:.8rem}
.rotulo{display:flex;justify-content:space-between;align-items:baseline;
        color:var(--bruma);font-size:.87rem;margin-bottom:.5rem}
.letra{color:var(--fosforo);font-weight:700;font-size:1rem}
.coord{
  font-family:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;
  font-variant-numeric:tabular-nums;font-size:1.4rem;font-weight:600;
  color:var(--espuma);line-height:1.34;margin:0;
}
.vars{width:100%;border-collapse:collapse;margin-top:.8rem;font-size:.87rem}
.vars td{padding:.32rem 0;border-top:1px solid var(--agua-clara);color:var(--bruma)}
.vars td:nth-child(2){text-align:right;color:var(--espuma);
  font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;padding-right:.6rem}
.vars td:nth-child(3){text-align:right;width:6.8rem;font-weight:600}
.alta{color:var(--fosforo)} .media{color:var(--espuma)} .baja{color:var(--alarma)}
.significa{display:block;font-size:.76rem;color:var(--bruma);margin-top:.05rem}
.nivel{margin:.1rem 0 .4rem;font-size:1rem;color:var(--espuma);font-weight:600}
.nivel.top{color:var(--fosforo)}
.nivel.bajo{color:var(--alarma)}
.nivel.regular{color:var(--bruma)}
.limite{display:inline-block;margin:0 0 .55rem;padding:.12rem .5rem;border-radius:.35rem;
        background:#2a1a0f;color:var(--alarma);font-size:.8rem;font-weight:600}
.aviso-dia{margin:1.4rem 0 0;padding:.8rem .9rem;border-radius:.55rem;
  background:#2a1a0f;border-left:3px solid var(--alarma);
  font-size:.92rem;color:var(--bruma);line-height:1.45}
.aviso-dia strong{color:var(--alarma)}
.aviso-info{margin:1.4rem 0 0;padding:.8rem .9rem;border-radius:.55rem;
  background:#10293a;border-left:3px solid var(--fosforo);
  font-size:.9rem;color:var(--bruma);line-height:1.45}
.aviso-info strong{color:var(--espuma)}
.copiar{margin-top:.8rem;width:100%;background:transparent;color:var(--fosforo);
        border:1px solid var(--agua-clara);border-radius:.45rem;padding:.6rem;
        font-size:.95rem;font-weight:600;cursor:pointer}
.copiar.listo{color:var(--agua-honda);background:var(--fosforo);border-color:var(--fosforo)}
.aviso{margin-top:1.4rem;padding:1rem;border-radius:.6rem;
       background:var(--agua);border:1px solid var(--agua-clara)}
.aviso h2{margin-bottom:.4rem;font-size:1.02rem}
.aviso p{margin:0;color:var(--bruma);font-size:.93rem}
.fuente{margin-top:1.6rem;color:var(--bruma);font-size:.8rem;line-height:1.45}
</style>
</head>
<body>

<section id="acceso">
  <div class="logo">PredictaMAR</div>
  <p class="bajada">Zonas con mejores condiciones para la pesca · Pucusana</p>
  <label for="u">Usuario</label>
  <input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
  <label for="c">Contraseña</label>
  <input id="c" type="password" autocomplete="current-password">
  <p class="error" id="err"></p>
  <button class="principal" id="entrar" type="button">Entrar</button>
</section>

<div id="app" class="oculto">
  <header>
    <span class="marca">PredictaMAR <span class="caleta">· <span id="quien"></span></span></span>
    <button class="salir" id="salir" type="button">Salir</button>
  </header>

  <div id="dato" class="dato">Cargando…</div>

  <div class="hoy oculto" id="hoy">
    <p class="hoy-titulo">Hoy, en todo el mar de Pucusana</p>
    <div class="fichas" id="fichas"></div>
  </div>

  <section class="panel">
    <h2>Qué y desde dónde</h2>

    <label for="esp">Especie</label>
    <select id="esp"></select>

    <label for="partida">Punto de partida</label>
    <select id="partida">
      <option value="puerto">Puerto de Pucusana</option>
      <option value="propio">Otras coordenadas</option>
    </select>

    <div class="par oculto" id="caja-coords">
      <div><label for="plat">Latitud</label>
           <input id="plat" type="text" placeholder="-12.47720"></div>
      <div><label for="plon">Longitud</label>
           <input id="plon" type="text" placeholder="-76.79530"></div>
    </div>
    <p class="nota oculto" id="nota-coords">En grados decimales y dentro de 80 km de Pucusana.</p>

    <div class="par">
      <div>
        <label for="dist">Cuánto vas a navegar</label>
        <select id="dist">
          <option value="10">Hasta 10 km</option>
          <option value="20">Hasta 20 km</option>
          <option value="30">Hasta 30 km</option>
          <option value="50">Hasta 50 km</option>
          <option value="80" selected>Hasta 80 km</option>
        </select>
      </div>
      <div>
        <label for="n">Cuántas zonas</label>
        <select id="n">
          <option>3</option><option selected>4</option><option>5</option>
        </select>
      </div>
    </div>

    <button class="principal" id="buscar" type="button">Ver zonas</button>
  </section>

  <main id="cuerpo"></main>
</div>

<script>
/* ---------------------------------------------------------------------
   ACCESO — control de acceso, NO seguridad. Se guarda la HUELLA de cada
   contrasena (SHA-256 de "usuario:contrasena"), no la contrasena: el sitio
   es publico y la contrasena escrita quedaria en el historial para siempre.
   Quien sepa programar puede saltarse esta pantalla editando la pagina.

   PARA AGREGAR UN PESCADOR, en PowerShell:
     $s="usuario:contrasena"
     [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($s))).Replace("-","").ToLower()
   y se agrega aqui una linea  usuario:"huella",
   --------------------------------------------------------------------- */
const USUARIOS = {
  randy:    "49e3cbdace0268089193e958a81f10b7620d9a5976058b85b146dde2569d1848",
  maik:     "0380fee3a531675dac94801536acf0b65ed896eaf93d1c7acc5d7a114947478b",
  samantha: "273c693b0bfb368eead34c6d8804ea993057459b84c1e21178f5120f60a3260f",
};
const CLAVE_SESION = "predictamar_sesion";

const PUERTO = {lat:-12.4772, lon:-76.7953};
const ALCANCE_KM = 80;
const RUTA = new URLSearchParams(location.search).get("datos") || "publicado/ranking_actual.json";
const LETRAS = ["A","B","C","D","E","F"];
/* Separacion minima entre zonas: una celda de clorofila (4 km). Sin esto
   salian tres tarjetas identicas, del mismo parche a 1,7 km. */
const MIN_SEP_KM = 4;

/* La HORA DE LANCE no esta en esta version, a proposito. Para pronosticar
   el perico se necesita la temperatura del modelo, y medida contra el
   satelite cambio la calificacion en 57 a 81 % de las zonas en los dias
   recientes: el mar esta en 21 C, justo en el borde de la curva del perico.
   Vuelve cuando el mar pase de 22 C y el perico entre a su zona comoda. */

let DATOS = null, CATALOGO = [], ESPECIE = null;
const $ = id => document.getElementById(id);
const rad = g => g * Math.PI / 180;

async function huella(t){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,"0")).join("");
}
function distanciaKm(a, b, c, d){
  const s = Math.sin(rad(c-a)/2)**2 + Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(rad(d-b)/2)**2;
  return 2*6371.0088*Math.asin(Math.min(1, Math.sqrt(s)));
}
function rumboCardinal(a, b, c, d){
  const y = Math.sin(rad(d-b))*Math.cos(rad(c));
  const x = Math.cos(rad(a))*Math.sin(rad(c)) - Math.sin(rad(a))*Math.cos(rad(c))*Math.cos(rad(d-b));
  const g = (Math.atan2(y,x)*180/Math.PI + 360) % 360;
  return ["norte","noreste","este","sureste","sur","suroeste","oeste","noroeste"][Math.round(g/45) % 8];
}
function grados(v, esLat){
  const h = esLat ? (v<0?"S":"N") : (v<0?"O":"E");
  const a = Math.abs(v), g = Math.floor(a);
  return `${g}° ${((a-g)*60).toFixed(3)}' ${h}`;
}
function fechaLegible(iso){
  const [,m,d] = iso.split("-").map(Number);
  return `${d} de ${["enero","febrero","marzo","abril","mayo","junio","julio",
    "agosto","setiembre","octubre","noviembre","diciembre"][m-1]}`;
}
function interp(x, pts){
  if(x <= pts[0][0]) return pts[0][1];
  if(x >= pts[pts.length-1][0]) return pts[pts.length-1][1];
  for(let i=0;i<pts.length-1;i++){
    const [x0,y0]=pts[i],[x1,y1]=pts[i+1];
    if(x0<=x && x<=x1) return x1===x0 ? y1 : y0+(x-x0)*(y1-y0)/(x1-x0);
  }
  return pts[pts.length-1][1];
}

/* Calificacion por el puntaje REAL, con los mismos cortes que las variables
   (favorable desde 0,66, regular desde 0,33). */
function calificar(p){
  if(p >= 66) return ["Muy buena"," top"];
  if(p >= 50) return ["Buena",""];
  if(p >= 33) return ["Regular"," regular"];
  return ["Mala"," bajo"];
}

/* ---------------- especies ---------------- */
/* Un archivo del motor anterior no trae especies: se arma un catalogo
   minimo con la anchoveta, para que la app nunca se rompa en la transicion. */
function catalogoDe(d){
  if(d.catalogo_especies && d.catalogo_especies.length) return d.catalogo_especies;
  return [{id:"anchoveta", nombre:"Anchoveta", estado:"listo", metodo:"suma",
           variables:["sst_ostia","salinidad","clorofila","nivel_mar","prod_primaria"],
           curvas:{}, fuente:null, aviso:null}];
}
const especie = id => CATALOGO.find(e => e.id === id);
function puntajeDe(c, id){
  if(c.especies && c.especies[id]) return c.especies[id].puntaje;
  if(id === "anchoveta") return c.puntaje;
  return null;
}
const enLimite = (c, id) => !!(c.especies && c.especies[id] && c.especies[id].en_limite);
function candidatos(){
  return (DATOS.candidatos && DATOS.candidatos.length) ? DATOS.candidatos : (DATOS.puntos || []);
}

/* ---------------- variables ---------------- */
const NOMBRES = {
  sst_ostia:["Temperatura","°C",1], salinidad:["Salinidad","UPS",2],
  clorofila:["Clorofila","mg/m³",2], nivel_mar:["Nivel del mar","m",2],
  prod_primaria:["Productividad","mg C/m³",0]
};
/* El juicio de cada variable es el de LA ESPECIE ELEGIDA. La misma
   salinidad alta que desfavorece a la anchoveta es la que favorece al
   perico: usar un solo criterio le mentiria al pescador. */
function juicio(f){
  if(f >= 0.66) return ["alta","favorable"];
  if(f >= 0.33) return ["media","regular"];
  return ["baja","desfavorable"];
}
function favDe(esp, var_, det){
  if(esp.curvas && esp.curvas[var_]) return interp(det.valor, esp.curvas[var_]);
  return det.favorabilidad;
}
/* Descripcion del AGUA segun su VALOR, igual para cualquier especie.
   Salinidad: masas de agua de Zuta y Guillen (1970). Temperatura: franjas
   descriptivas. Clorofila y productividad solo aparecen para la anchoveta. */
function significa(var_, det, f){
  const v = det.valor;
  if(var_ === "salinidad"){
    if(v > 35.1) return "agua subtropical";
    if(v >= 34.8) return "agua costera fría";
    return "agua ecuatorial";
  }
  if(var_ === "sst_ostia"){
    if(v >= 22) return "agua cálida";
    if(v >= 18) return "agua templada";
    return "agua fría";
  }
  if(var_ === "clorofila") return f >= 0.66 ? "mucho alimento" : f >= 0.33 ? "alimento moderado" : "poco alimento";
  if(var_ === "prod_primaria") return f >= 0.66 ? "mar productivo" : f >= 0.33 ? "productividad media" : "mar poco productivo";
  return null;
}
function tablaVariables(esp, detalle){
  if(!detalle) return null;
  const t = document.createElement("table");
  t.className = "vars";
  for(const k of (esp.variables || [])){
    const d = detalle[k];
    if(!d || !NOMBRES[k]) continue;
    const [nom, uni, dec] = NOMBRES[k];
    const f = favDe(esp, k, d);
    const [cls, txt] = juicio(f);
    const tr = t.insertRow();
    const nc = tr.insertCell();
    nc.textContent = nom;
    const sig = significa(k, d, f);
    if(sig){ const e = document.createElement("span"); e.className = "significa"; e.textContent = sig; nc.appendChild(e); }
    tr.insertCell().textContent = `${Number(d.valor).toFixed(dec)} ${uni}`;
    const c = tr.insertCell(); c.className = cls; c.textContent = txt;
  }
  return t;
}

/* ---------------- acceso ---------------- */
async function entrar(){
  const u = $("u").value.trim().toLowerCase();
  const ok = USUARIOS[u] && USUARIOS[u] === await huella(u + ":" + $("c").value);
  if(!ok){ $("err").textContent = "Usuario o contraseña incorrectos."; return; }
  $("err").textContent = "";
  try{ sessionStorage.setItem(CLAVE_SESION, u); }catch(e){}
  abrirApp(u);
}
function abrirApp(u){
  $("acceso").classList.add("oculto");
  $("app").classList.remove("oculto");
  $("quien").textContent = u.charAt(0).toUpperCase() + u.slice(1);
  window.scrollTo(0, 0);
  cargar();
}
$("entrar").addEventListener("click", entrar);
$("c").addEventListener("keydown", e => { if(e.key === "Enter") entrar(); });
$("salir").addEventListener("click", () => { try{ sessionStorage.removeItem(CLAVE_SESION); }catch(e){} location.reload(); });

/* ---------------- controles ---------------- */
$("partida").addEventListener("change", e => {
  const propio = e.target.value === "propio";
  $("caja-coords").classList.toggle("oculto", !propio);
  $("nota-coords").classList.toggle("oculto", !propio);
  mostrar();
});
$("buscar").addEventListener("click", mostrar);
for(const id of ["dist","n"]) $(id).addEventListener("change", mostrar);
$("esp").addEventListener("change", e => { ESPECIE = e.target.value; pintarHoy(); mostrar(); });

/* Selector con las diez especies, agrupadas por estado. Ninguna se oculta. */
function armarSelector(){
  const grupos = [["listo","Disponibles"],["preparacion","En preparación"],
                  ["baja_confianza","El satélite no las puede ver"]];
  const sel = $("esp");
  sel.innerHTML = "";
  for(const [estado, titulo] of grupos){
    const de = CATALOGO.filter(e => e.estado === estado);
    if(!de.length) continue;
    const og = document.createElement("optgroup");
    og.label = titulo;
    for(const e of de){
      const o = document.createElement("option");
      o.value = e.id; o.textContent = e.nombre;
      og.appendChild(o);
    }
    sel.appendChild(og);
  }
  sel.value = ESPECIE;
}

/* Panel Hoy: la mejor zona de cada especie lista, en todo el mar.
   Tocar una ficha elige esa especie. */
function resumen(){
  if(DATOS.resumen_especies) return DATOS.resumen_especies;
  const r = {}, C = candidatos();
  for(const e of CATALOGO.filter(x => x.estado === "listo")){
    const ps = C.map(c => puntajeDe(c, e.id)).filter(x => x != null);
    if(ps.length){ const m = Math.max(...ps); r[e.id] = {mejor:m, calificacion:calificar(m)[0]}; }
  }
  return r;
}
function pintarHoy(){
  const r = resumen(), cont = $("fichas");
  cont.innerHTML = "";
  const ids = Object.keys(r).sort((a,b) => r[b].mejor - r[a].mejor);
  if(!ids.length){ $("hoy").classList.add("oculto"); return; }
  $("hoy").classList.remove("oculto");
  for(const id of ids){
    const e = especie(id); if(!e) continue;
    const [lab, cls] = calificar(r[id].mejor);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ficha" + (id === ESPECIE ? " activa" : "");
    b.innerHTML = `<span>${e.nombre}</span><span class="ficha-cal nivel${cls}">${lab}</span>`;
    b.addEventListener("click", () => { ESPECIE = id; $("esp").value = id; pintarHoy(); mostrar(); });
    cont.appendChild(b);
  }
}

/* ---------------- datos ---------------- */
async function cargar(){
  try{
    const res = await fetch(RUTA, {cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    DATOS = await res.json();
    if(!candidatos().length) throw new Error("vacio");
    CATALOGO = catalogoDe(DATOS);

    /* Especie inicial: la que tiene mejores condiciones hoy. Asi la app
       muestra primero lo que vale la pena, y cambia sola con el mar. */
    const r = resumen();
    const mejor = Object.keys(r).sort((a,b) => r[b].mejor - r[a].mejor)[0];
    ESPECIE = mejor || (CATALOGO.find(e => e.estado === "listo") || CATALOGO[0]).id;

    /* Antiguedad contra la fecha de HOY en Lima, no la guardada en el archivo. */
    const [ya, ym, yd] = DATOS.fecha_datos.split("-").map(Number);
    const lima = new Date(Date.now() - 5*3600*1000);
    const hoy = Date.UTC(lima.getUTCFullYear(), lima.getUTCMonth(), lima.getUTCDate());
    const dias = Math.round((hoy - Date.UTC(ya, ym-1, yd)) / 86400000);
    const viejo = dias > 4;
    $("dato").className = "dato" + (viejo ? " viejo" : "");
    $("dato").innerHTML = viejo
      ? `<strong>Datos atrasados.</strong> Lo último que se pudo calcular es del ${fechaLegible(DATOS.fecha_datos)}. El mar ya cambió: úsalo solo como referencia.`
      : `<strong>Condiciones para hoy</strong> · satélite de los últimos días, hasta el ${fechaLegible(DATOS.fecha_datos)}.`;

    armarSelector();
    pintarHoy();
    mostrar();
  }catch(e){
    $("dato").className = "dato viejo";
    $("dato").innerHTML = "<strong>Sin datos.</strong>";
    $("cuerpo").innerHTML = `<div class="aviso"><h2>No se pudo cargar</h2><p>No hay conexión y tampoco un resultado guardado en este teléfono.</p></div>`;
  }
}

function origen(){
  if($("partida").value === "puerto") return PUERTO;
  const la = parseFloat($("plat").value.replace(",", "."));
  const lo = parseFloat($("plon").value.replace(",", "."));
  if(!isFinite(la) || !isFinite(lo)) return {error:"Escribe las dos coordenadas en grados decimales."};
  const d = distanciaKm(PUERTO.lat, PUERTO.lon, la, lo);
  if(d > ALCANCE_KM) return {error:`Ese punto está a ${d.toFixed(0)} km de Pucusana. El sistema solo cubre ${ALCANCE_KM} km.`};
  return {lat:la, lon:lo};
}

function mostrar(){
  const cuerpo = $("cuerpo");
  cuerpo.innerHTML = "";
  if(!DATOS) return;
  const esp = especie(ESPECIE);
  if(!esp) return;

  /* Especies sin perfil listo: se muestran, pero sin inventar zonas. */
  if(esp.estado !== "listo"){
    const titulo = esp.estado === "preparacion" ? "Perfil en preparación" : "El satélite no puede verla";
    cuerpo.innerHTML = `<div class="aviso"><h2>${esp.nombre} · ${titulo}</h2><p>${esp.aviso || ""}</p></div>`;
    return;
  }

  const o = origen();
  if(o.error){
    cuerpo.innerHTML = `<div class="aviso"><h2>Revisa el punto de partida</h2><p>${o.error}</p></div>`;
    return;
  }

  const alcance = parseFloat($("dist").value);
  const cuantas = parseInt($("n").value, 10);

  const lista = candidatos().map(c => ({
    c, p: puntajeDe(c, esp.id), lat: c.lat, lon: c.lon,
    desde_ti: distanciaKm(o.lat, o.lon, c.lat, c.lon),
    rumbo: rumboCardinal(o.lat, o.lon, c.lat, c.lon)
  })).filter(z => z.p != null);

  /* Se filtra por su radio, se ordena por condiciones, y cada zona nueva
     tiene que quedar a mas de una celda de las ya elegidas. */
  const enRango = lista.filter(z => z.desde_ti <= alcance).sort((a,b) => b.p - a.p);
  const dentro = [];
  for(const z of enRango){
    if(dentro.every(e => distanciaKm(e.lat, e.lon, z.lat, z.lon) >= MIN_SEP_KM)){
      dentro.push(z);
      if(dentro.length >= cuantas) break;
    }
  }

  if(!dentro.length){
    const c = lista.sort((a,b) => a.desde_ti - b.desde_ti)[0];
    cuerpo.innerHTML = `<div class="aviso"><h2>Nada dentro de ${alcance} km</h2>
      <p>La zona más cercana está a <strong>${c ? c.desde_ti.toFixed(0) : "?"} km</strong> hacia el
      <strong>${c ? c.rumbo : "?"}</strong>. Amplía la distancia o cambia tu punto de partida.</p></div>`;
    return;
  }

  /* Avisos del dia, para la especie elegida. */
  const mejorDia = Math.max(...lista.map(z => z.p));
  if(mejorDia < 50){
    const av = document.createElement("div");
    av.className = "aviso-dia";
    av.innerHTML = `<strong>Hoy el mar está ${calificar(mejorDia)[0].toLowerCase()} para ${esp.nombre.toLowerCase()} en toda la zona.</strong>
      Estas son las mejores opciones disponibles, pero ninguna tiene condiciones realmente buenas.`;
    cuerpo.appendChild(av);
  }
  /* Aviso de temperatura en el limite, que le diga algo que pueda HACER.
     "Prefiere las zonas sin aviso" no sirve si dentro de su distancia no hay
     ninguna: ahi se le dice que las firmes estan mas lejos. */
  const nLim = lista.filter(z => enLimite(z.c, esp.id)).length;
  if(nLim > lista.length / 2){
    const firmesAca = dentro.some(z => !enLimite(z.c, esp.id));
    const firmesLejos = lista.filter(z => z.desde_ti > alcance && !enLimite(z.c, esp.id))
                             .sort((a,b) => a.desde_ti - b.desde_ti)[0];
    let msg;
    if(firmesAca){
      msg = "Prefiere las zonas sin aviso: son las más cálidas.";
    }else if(firmesLejos){
      msg = `Dentro de tu distancia todas están en el límite. Las zonas firmes, más cálidas, empiezan a unos <strong>${firmesLejos.desde_ti.toFixed(0)} km</strong> hacia el ${firmesLejos.rumbo}: amplía la distancia para verlas.`;
    }else{
      msg = "No hay zonas firmes en ningún lado hoy: todas pueden cambiar de un día para otro.";
    }
    const av = document.createElement("div");
    av.className = "aviso-info";
    av.innerHTML = `<strong>Hoy casi todo el mar está en el borde de temperatura del ${esp.nombre.toLowerCase()}.</strong> ${msg}`;
    cuerpo.appendChild(av);
  }

  /* El orden dice algo solo si entre la mejor y la peor de su lista hay al
     menos una desviacion tipica del dia. */
  const desv = (DATOS.reparto_puntajes && DATOS.reparto_puntajes.desviacion) || 5;
  const ps = dentro.map(z => z.p);
  const ordenado = ps.length > 1 && (Math.max(...ps) - Math.min(...ps)) >= desv;

  const h = document.createElement("h1");
  h.className = "encabeza";
  h.textContent = ordenado ? `Mejores zonas para ${esp.nombre.toLowerCase()}`
                           : `${dentro.length} zonas parecidas para ${esp.nombre.toLowerCase()}`;
  cuerpo.appendChild(h);
  const nota = document.createElement("p");
  nota.className = "aclara";
  nota.textContent = ordenado ? "Ordenadas de mejor a peor dentro de tu distancia."
    : "Dentro de tu distancia estas zonas tienen condiciones muy parecidas. Elige por distancia, combustible o por lo que ya conoces.";
  cuerpo.appendChild(nota);

  dentro.forEach((z, i) => {
    const caja = document.createElement("section");
    caja.className = "zona";

    const rot = document.createElement("div");
    rot.className = "rotulo";
    const a = document.createElement("span");
    a.className = "letra";
    a.textContent = ordenado ? String(i+1) : LETRAS[i];
    const b = document.createElement("span");
    b.textContent = `${z.desde_ti.toFixed(0)} km al ${z.rumbo}`;
    rot.append(a, b);
    caja.appendChild(rot);

    const [t0, extra] = calificar(z.p);
    const nv = document.createElement("p");
    nv.className = "nivel" + extra;
    nv.textContent = (ordenado && i === 0) ? t0 + " · la mejor de tu zona" : t0;
    caja.appendChild(nv);

    if(enLimite(z.c, esp.id)){
      const lm = document.createElement("span");
      lm.className = "limite";
      lm.textContent = "Temperatura en el límite";
      caja.appendChild(lm);
    }

    const co = document.createElement("p");
    co.className = "coord";
    co.innerHTML = `${grados(z.lat,true)}<br>${grados(z.lon,false)}`;
    caja.appendChild(co);

    const tv = tablaVariables(esp, z.c.detalle);
    if(tv) caja.appendChild(tv);

    const btn = document.createElement("button");
    btn.className = "copiar"; btn.type = "button";
    const plano = `${z.lat.toFixed(5)}, ${z.lon.toFixed(5)}`;
    btn.textContent = "Copiar coordenadas";
    btn.addEventListener("click", async () => {
      try{ await navigator.clipboard.writeText(plano); }
      catch(e){ const t = document.createElement("textarea"); t.value = plano; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
      btn.textContent = "Copiado: " + plano; btn.classList.add("listo");
      setTimeout(() => { btn.textContent = "Copiar coordenadas"; btn.classList.remove("listo"); }, 2600);
    });
    caja.appendChild(btn);
    cuerpo.appendChild(caja);
  });

  if(esp.fuente){
    const f = document.createElement("p");
    f.className = "fuente";
    f.textContent = "Base del perfil: " + esp.fuente + (esp.aviso ? " " + esp.aviso : "");
    cuerpo.appendChild(f);
  }
}

try{ const u = sessionStorage.getItem(CLAVE_SESION); if(u && USUARIOS[u]) abrirApp(u); }catch(e){}
</script>
